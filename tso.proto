syntax = "proto3";

package chronos.tso.v1;

option go_package = "github.com/chronos/chronos/gen/proto/tso/v1;tsov1";
option java_multiple_files = true;
option java_package = "com.chronos.tso.v1";
option java_outer_classname = "TsoProto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

service TimelineRouteService {
  rpc GetTimelineRoute(GetTimelineRouteRequest) returns (GetTimelineRouteResponse);
  rpc WatchTimelineRoutes(WatchTimelineRoutesRequest) returns (stream TimelineRouteEvent);
  rpc EnsureTimeline(EnsureTimelineRequest) returns (EnsureTimelineResponse);
}

service TimestampService {
  rpc AllocateTimestamps(AllocateTimestampsRequest) returns (AllocateTimestampsResponse);
}

service TimelineControlService {
  rpc TransferTimeline(TransferTimelineRequest) returns (TransferTimelineResponse);
  rpc Health(google.protobuf.Empty) returns (HealthResponse);
}

enum ResourceTier {
  RESOURCE_TIER_UNSPECIFIED = 0;
  RESOURCE_TIER_SHARED = 1;
  RESOURCE_TIER_WARM = 2;
  RESOURCE_TIER_DEDICATED = 3;
}

enum TimelineState {
  TIMELINE_STATE_UNSPECIFIED = 0;
  TIMELINE_STATE_CREATING = 1;
  TIMELINE_STATE_ACTIVE = 2;
  TIMELINE_STATE_DRAINING = 3;
  TIMELINE_STATE_LOCKED = 4;
  TIMELINE_STATE_RECOVERING = 5;
}

enum TimelineTransferReason {
  TIMELINE_TRANSFER_REASON_UNSPECIFIED = 0;
  TIMELINE_TRANSFER_REASON_REBALANCE = 1;
  TIMELINE_TRANSFER_REASON_HOTSPOT = 2;
  TIMELINE_TRANSFER_REASON_FAILOVER = 3;
  TIMELINE_TRANSFER_REASON_MANUAL = 4;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_NOT_TIMELINE_OWNER = 1;
  ERROR_CODE_ROUTE_VERSION_MISMATCH = 2;
  ERROR_CODE_EPOCH_MISMATCH = 3;
  ERROR_CODE_LEASE_EXPIRED = 4;
  ERROR_CODE_RATE_LIMITED = 5;
  ERROR_CODE_TEMPORARILY_UNAVAILABLE = 6;
  ERROR_CODE_TIMELINE_NOT_FOUND = 7;
  ERROR_CODE_INVALID_ARGUMENT = 8;
  ERROR_CODE_INTERNAL = 9;
}

message TimelineRoute {
  string timeline_key = 1;
  uint32 generator_id = 2;
  string owner_worker_endpoint = 3;
  uint64 epoch = 4;
  uint64 route_version = 5;
  ResourceTier resource_tier = 6;
  uint32 cache_ttl_ms = 7;
}

message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  uint64 current_epoch = 3;
  uint64 current_route_version = 4;
  string redirect_endpoint = 5;
}

message TimestampRange {
  uint64 start_tso = 1;
  uint64 end_tso = 2;
}

message GetTimelineRouteRequest {
  string timeline_key = 1;
  google.protobuf.UInt64Value cached_route_version = 2;
  string sdk_instance_id = 3;
}

message GetTimelineRouteResponse {
  TimelineRoute route = 1;
}

message WatchTimelineRoutesRequest {
  repeated string timeline_keys = 1;
  map<string, uint64> known_route_versions = 2;
  string sdk_instance_id = 3;
}

message TimelineRouteEvent {
  oneof event {
    TimelineRoute route = 1;
    TimelineRouteDelete tombstone = 2;
    WatchKeepalive keepalive = 3;
  }
}

message TimelineRouteDelete {
  string timeline_key = 1;
  uint64 route_version = 2;
}

message WatchKeepalive {
  google.protobuf.Timestamp server_time = 1;
}

message EnsureTimelineRequest {
  string timeline_key = 1;
  ResourceTier desired_resource_tier = 2;
}

message EnsureTimelineResponse {
  TimelineRoute route = 1;
}

message AllocateTimestampsRequest {
  string timeline_key = 1;
  uint32 count = 2;
  uint64 expected_epoch = 3;
  uint64 expected_route_version = 4;
  string client_request_id = 5;
  uint32 request_timeout_ms = 6;
}

message AllocateTimestampsResponse {
  string timeline_key = 1;
  uint32 generator_id = 2;
  uint64 epoch = 3;
  uint64 route_version = 4;
  repeated TimestampRange ranges = 5;
}

message TransferTimelineRequest {
  string timeline_key = 1;
  google.protobuf.UInt32Value target_generator_id = 2;
  google.protobuf.StringValue target_worker_id = 3;
  TimelineTransferReason reason = 4;
}

message TransferTimelineResponse {
  string timeline_key = 1;
  uint32 old_generator_id = 2;
  uint32 new_generator_id = 3;
  uint64 new_epoch = 4;
  uint64 route_version = 5;
  TimelineState state = 6;
}

message HealthResponse {
  string service = 1;
  string instance_id = 2;
  google.protobuf.Timestamp server_time = 3;
}
