syntax = "proto3";

package chronos.tso.v1;

option go_package = "github.com/rleungx/chronos/clients/go/gen/proto/tso/v1;tsov1";
option java_multiple_files = true;
option java_package = "com.chronos.tso.v1";
option java_outer_classname = "TsoProto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// Route-management RPCs are used by language clients internally.
// Application code should prefer a language-level Client wrapper instead of calling these
// methods directly.
service TimelineRouteService {
  rpc GetTimelineRoute(GetTimelineRouteRequest) returns (GetTimelineRouteResponse);
  rpc EnsureTimeline(EnsureTimelineRequest) returns (EnsureTimelineResponse);
}

// Timestamp allocation is the primary application-facing operation.
service TimestampService {
  rpc AllocateTimestamps(AllocateTimestampsRequest) returns (AllocateTimestampsResponse);
  // The bidirectional stream preserves request order and applies backpressure: each response
  // corresponds to the next request received on the stream. Any request error terminates the
  // stream with the same gRPC status and structured error details as AllocateTimestamps.
  rpc AllocateTimestampsStream(stream AllocateTimestampsRequest)
      returns (stream AllocateTimestampsResponse);
}

// Control and health RPCs are intended for operators, control planes, and diagnostics.
service TimelineControlService {
  rpc TransferTimeline(TransferTimelineRequest) returns (TransferTimelineResponse);
  rpc Health(google.protobuf.Empty) returns (HealthResponse);
}

// Status RPCs are intended for diagnostics and operator tooling.
service TimelineStatusService {
  rpc GetTimelineStatus(GetTimelineStatusRequest) returns (GetTimelineStatusResponse);
  rpc ListTimelineStatuses(ListTimelineStatusesRequest) returns (ListTimelineStatusesResponse);
}

enum ResourceTier {
  RESOURCE_TIER_UNSPECIFIED = 0;
  RESOURCE_TIER_SHARED = 1;
  RESOURCE_TIER_WARM = 2;
  RESOURCE_TIER_DEDICATED = 3;
}

enum TimelineState {
  TIMELINE_STATE_UNSPECIFIED = 0;
  TIMELINE_STATE_CREATING = 1;
  TIMELINE_STATE_ACTIVE = 2;
  TIMELINE_STATE_DRAINING = 3;
  TIMELINE_STATE_LOCKED = 4;
  TIMELINE_STATE_RECOVERING = 5;
}

enum TimelineTransferReason {
  TIMELINE_TRANSFER_REASON_UNSPECIFIED = 0;
  TIMELINE_TRANSFER_REASON_REBALANCE = 1;
  TIMELINE_TRANSFER_REASON_HOTSPOT = 2;
  TIMELINE_TRANSFER_REASON_FAILOVER = 3;
  TIMELINE_TRANSFER_REASON_MANUAL = 4;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_NOT_TIMELINE_OWNER = 1;
  ERROR_CODE_ROUTE_VERSION_MISMATCH = 2;
  ERROR_CODE_EPOCH_MISMATCH = 3;
  ERROR_CODE_LEASE_EXPIRED = 4;
  ERROR_CODE_RATE_LIMITED = 5;
  ERROR_CODE_TEMPORARILY_UNAVAILABLE = 6;
  ERROR_CODE_TIMELINE_NOT_FOUND = 7;
  ERROR_CODE_INVALID_ARGUMENT = 8;
  ERROR_CODE_INTERNAL = 9;
}

enum OperatorActionBlocker {
  OPERATOR_ACTION_BLOCKER_UNSPECIFIED = 0;
  OPERATOR_ACTION_BLOCKER_LEASE_NOT_EXPIRED = 1;
  OPERATOR_ACTION_BLOCKER_RECOVERY_FLOOR_MISSING = 2;
}

enum OperatorActionNextStep {
  OPERATOR_ACTION_NEXT_STEP_UNSPECIFIED = 0;
  OPERATOR_ACTION_NEXT_STEP_WAIT_FOR_LEASE_EXPIRY = 1;
  OPERATOR_ACTION_NEXT_STEP_PERSIST_RECOVERY_FLOOR = 2;
}

message TimelineRoute {
  string timeline_key = 1;
  uint32 generator_id = 2;
  string owner_worker_endpoint = 3;
  uint64 epoch = 4;
  uint64 route_version = 5;
  ResourceTier resource_tier = 6;
}

message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  uint64 current_epoch = 3;
  uint64 current_route_version = 4;
  string redirect_endpoint = 5;
  OperatorActionBlocker action_blocker = 6;
  OperatorActionNextStep next_step = 7;
}

message TimestampRange {
  uint64 start_tso = 1;
  uint64 end_tso = 2;
}

message GetTimelineRouteRequest {
  string timeline_key = 1;
}

message GetTimelineRouteResponse {
  TimelineRoute route = 1;
}

message EnsureTimelineRequest {
  string timeline_key = 1;
  ResourceTier desired_resource_tier = 2;
}

message EnsureTimelineResponse {
  TimelineRoute route = 1;
}

message AllocateTimestampsRequest {
  string timeline_key = 1;
  uint32 count = 2;
  uint64 expected_epoch = 3;
  uint64 expected_route_version = 4;
  string client_request_id = 5;
  uint32 request_timeout_ms = 6;
}

message AllocateTimestampsResponse {
  string timeline_key = 1;
  uint32 generator_id = 2;
  uint64 epoch = 3;
  uint64 route_version = 4;
  repeated TimestampRange ranges = 5;
}

message TransferTimelineRequest {
  string timeline_key = 1;
  google.protobuf.UInt32Value target_generator_id = 2;
  google.protobuf.StringValue target_worker_id = 3;
  TimelineTransferReason reason = 4;
}

message TransferTimelineResponse {
  string timeline_key = 1;
  uint32 old_generator_id = 2;
  uint32 new_generator_id = 3;
  uint64 new_epoch = 4;
  uint64 route_version = 5;
  TimelineState state = 6;
}

enum WorkerReadinessState {
  WORKER_READINESS_STATE_UNSPECIFIED = 0;
  WORKER_READINESS_STATE_READY = 1;
  WORKER_READINESS_STATE_DEGRADED = 2;
}

enum WorkerReadinessReason {
  WORKER_READINESS_REASON_UNSPECIFIED = 0;
  WORKER_READINESS_REASON_SERVING = 1;
  WORKER_READINESS_REASON_STARTUP_PREFLIGHT_FAILED = 2;
  WORKER_READINESS_REASON_METADATA_STARTUP_PROBE_FAILED = 3;
  WORKER_READINESS_REASON_IDENTITY_LEASE_ACQUIRE_FAILED = 4;
  WORKER_READINESS_REASON_IDENTITY_LEASE_LOST = 5;
  WORKER_READINESS_REASON_SHUTTING_DOWN = 6;
  WORKER_READINESS_REASON_DRAINING = 7;
  WORKER_READINESS_REASON_OWNERSHIP_DRIFT = 8;
}

message HealthResponse {
  string service = 1;
  string instance_id = 2;
  google.protobuf.Timestamp server_time = 3;

  string worker_id = 4;
  string advertise_endpoint = 5;
  WorkerReadinessState readiness_state = 6;
  WorkerReadinessReason readiness_reason = 7;
  bool identity_lease_healthy = 8;
  string build_version = 9;
  string build_commit = 10;
}

enum TimelineFailoverReadiness {
  TIMELINE_FAILOVER_READINESS_UNSPECIFIED = 0;
  TIMELINE_FAILOVER_READINESS_NOT_APPLICABLE = 1;
  TIMELINE_FAILOVER_READINESS_ELIGIBLE = 2;
  TIMELINE_FAILOVER_READINESS_WAITING_FOR_LEASE_EXPIRY = 3;
  TIMELINE_FAILOVER_READINESS_BLOCKED_MISSING_RECOVERY_FLOOR = 4;
}

message TimelineStatus {
  TimelineRoute route = 1;
  TimelineState state = 2;
  google.protobuf.UInt64Value recovery_floor_tso = 3;
  google.protobuf.UInt64Value issued_upper_bound = 4;
  google.protobuf.UInt64Value last_graceful_issued = 5;
  google.protobuf.UInt64Value lease_expire_at_ms = 6;
  google.protobuf.StringValue owner_instance_id = 7;
  uint64 updated_at_ms = 8;
  TimelineFailoverReadiness failover_readiness = 9;
}

message GetTimelineStatusRequest {
  string timeline_key = 1;
}

message GetTimelineStatusResponse {
  TimelineStatus status = 1;
}

message ListTimelineStatusesRequest {
  repeated TimelineState states = 1;
  google.protobuf.StringValue owner_worker_endpoint = 2;
  uint32 page_size = 3;
  string page_token = 4;
}

message ListTimelineStatusesResponse {
  repeated TimelineStatus statuses = 1;
  string next_page_token = 2;
}
