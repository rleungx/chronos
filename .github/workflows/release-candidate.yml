name: Release Candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CHRONOS_ARTIFACT_RETENTION_DAYS: 14
  CHRONOS_IMAGE_REPOSITORY: ghcr.io/rleungx/chronos
  DOCKER_BUILDKIT: 1

jobs:
  release-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Validate root release version surfaces and tag
        id: version
        env:
          CHRONOS_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          make release-version-check
          version=$(awk '
            $0 == "[package]" { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && $1 == "version" {
              value = $3
              gsub(/^"|"$/, "", value)
              print value
            }
          ' Cargo.toml)
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - release-version
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.x'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          gradle-version: '9.4.0'
      - name: Install CI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ruby cmake libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc
          HELM_VERSION=v3.17.3
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          tar -C /tmp -xzf /tmp/helm.tar.gz
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate GitHub Actions workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Run release checks
        run: make release-check-core

  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - release-check
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Package release artifacts
        run: make release-package
      - name: Upload reusable release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}

  layer-4-clustered-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - release-version
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Start clustered etcd
        run: make etcd-cluster-up
      - name: Wait for clustered etcd health
        run: |
          for attempt in $(seq 1 60); do
            if make etcd-cluster-health; then
              exit 0
            fi
            if [ "$attempt" -lt 60 ]; then
              sleep 1
            fi
          done
          echo "clustered etcd did not become healthy within 60 attempts" >&2
          exit 1
      - name: Run clustered Layer 4 validation
        run: make test-layer-4-clustered
      - name: Run clustered etcd leader-loss validation
        run: make test-cluster-leader-loss
      - name: Upload clustered leader-loss artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-cluster-leader-loss-artifacts
          path: artifacts/cluster-leader-loss/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify clustered leader-loss evidence
        if: always()
        run: bash hack/verify-cluster-leader-loss.sh artifacts/cluster-leader-loss/summary.txt
      - name: Run owner-to-etcd partition validation
        run: make test-owner-etcd-partition
      - name: Upload owner-to-etcd partition artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-owner-etcd-partition-artifacts
          path: artifacts/owner-etcd-partition/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify owner-to-etcd partition evidence
        if: always()
        run: bash hack/verify-owner-etcd-partition.sh artifacts/owner-etcd-partition/summary.txt
      - name: Fetch pinned rolling-upgrade baseline
        run: |
          source hack/upgrade/baseline.env
          git fetch --no-tags --depth=1 origin "${CHRONOS_UPGRADE_BASE_SHA}"
      - name: Run same-format rolling-upgrade validation
        run: make test-rolling-upgrade
      - name: Upload rolling-upgrade artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-rolling-upgrade-artifacts
          path: artifacts/rolling-upgrade/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify rolling-upgrade evidence
        if: always()
        run: bash hack/verify-rolling-upgrade.sh artifacts/rolling-upgrade/summary.txt
      - name: Stop clustered etcd
        if: always()
        run: make etcd-cluster-reset

  soak-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run etcd-backed soak validation
        run: make test-soak
      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-soak-artifacts
          path: artifacts/soak/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify soak evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts soak
      - name: Reset etcd after soak job
        if: always()
        run: make etcd-reset

  chaos-lease-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run etcd-backed chaos recovery validation
        run: make test-chaos
      - name: Upload chaos artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-chaos-artifacts
          path: artifacts/chaos/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify chaos evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts chaos
      - name: Reset etcd after chaos job
        if: always()
        run: make etcd-reset

  failover-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run etcd-backed failover benchmark
        run: make test-failover-bench
      - name: Upload failover artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-failover-artifacts
          path: artifacts/failover/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify failover evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts failover
      - name: Reset etcd after failover job
        if: always()
        run: make etcd-reset

  auto-failover-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run etcd-backed automatic failover benchmark
        run: make test-auto-failover-bench
      - name: Upload automatic failover artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-auto-failover-artifacts
          path: artifacts/auto-failover/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify automatic failover evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts auto-failover
      - name: Reset etcd after automatic failover job
        if: always()
        run: make etcd-reset

  scale-matrix-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run co-located production-profile scale stress
        run: make test-scale-matrix-production
      - name: Upload scale matrix artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-scale-matrix-artifacts
          path: artifacts/scale-matrix/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify co-located scale stress evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts scale-matrix-stress
      - name: Require L2 production scale evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts scale-matrix
      - name: Reset etcd after scale matrix job
        if: always()
        run: make etcd-reset

  rebalance-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run etcd-backed rebalance benchmark
        run: make test-rebalance-bench
      - name: Upload rebalance artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-rebalance-artifacts
          path: artifacts/rebalance/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify rebalance evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts rebalance
      - name: Reset etcd after rebalance job
        if: always()
        run: make etcd-reset

  restore-dr-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run restore DR validation
        run: make test-restore-dr
      - name: Upload restore artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-restore-artifacts
          path: artifacts/restore/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify restore evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts restore

  container-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - release-version
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Build container image
        run: make CONTAINER_CHECK_IMAGE=chronos:rc CONTAINER_CHECK_FORCE_BUILD=1 container-image-check
      - name: Save container image
        run: docker save chronos:rc -o chronos-rc-image.tar
      - name: Create container image checksum
        run: sha256sum chronos-rc-image.tar > chronos-rc-image.tar.sha256
      - name: Upload container image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-image
          path: |
            chronos-rc-image.tar
            chronos-rc-image.tar.sha256
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}

  container-runtime-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - container-image
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-image
      - name: Verify container image checksum
        run: sha256sum -c chronos-rc-image.tar.sha256
      - name: Load container image
        run: docker load -i chronos-rc-image.tar
      - name: Validate container runtime asset
        run: make CONTAINER_CHECK_IMAGE=chronos:rc CONTAINER_CHECK_FORCE_BUILD=0 container-check

  container-vulnerability-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - container-image
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-image
      - name: Verify container image checksum
        run: sha256sum -c chronos-rc-image.tar.sha256
      - name: Load container image
        run: docker load -i chronos-rc-image.tar
      - name: Scan container image vulnerabilities
        run: make CONTAINER_CHECK_IMAGE=chronos:rc CONTAINER_CHECK_FORCE_BUILD=0 container-vulnerability-scan

  package-release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: write
      id-token: write
    needs:
      - release-check
      - release-artifacts
      - layer-4-clustered-etcd
      - soak-real-etcd
      - chaos-lease-loss
      - failover-real-etcd
      - auto-failover-real-etcd
      - scale-matrix-real-etcd
      - rebalance-real-etcd
      - restore-dr-etcd
      - container-runtime-check
      - container-vulnerability-scan
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: artifacts/release/*
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-release-candidate
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  publish-server-release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-server-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.release-version.outputs.version }}
      COMMIT: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      REGISTRY_API: https://ghcr.io/v2/rleungx/chronos/manifests
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ github.token }}
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    needs:
      - release-version
      - container-image
      - package-release-artifacts
    steps:
      - name: Check out publication verifier
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-release-candidate
          path: artifacts/release
      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-image
      - name: Verify container image checksum
        run: sha256sum -c chronos-rc-image.tar.sha256
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Load container image
        id: load
        run: |
          docker load -i chronos-rc-image.tar
          candidate_config=$(docker image inspect chronos:rc --format '{{.Id}}')
          python3 hack/verify-server-image-publication.py alias-verify 200 "$candidate_config" "$candidate_config"
          echo "candidate_config=$candidate_config" >> "$GITHUB_OUTPUT"
      - name: Preflight mutable discovery aliases
        id: preflight
        run: |
          candidate_config=${{ steps.load.outputs.candidate_config }}
          registry_token=$(curl --retry 3 -fsS -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" "https://ghcr.io/token?scope=repository:rleungx/chronos:pull,push" | jq -er .token)
          version_status=$(curl --retry 3 -sS -H "Authorization: Bearer $registry_token" -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" -w '%{http_code}' "$REGISTRY_API/$VERSION" -o version.json)
          version_observed=$(if [[ "$version_status" == 200 ]]; then jq -er '.config.digest' version.json; fi)
          commit_status=$(curl --retry 3 -sS -H "Authorization: Bearer $registry_token" -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" -w '%{http_code}' "$REGISTRY_API/$COMMIT" -o commit.json)
          commit_observed=$(if [[ "$commit_status" == 200 ]]; then jq -er '.config.digest' commit.json; fi)
          version_decision=$(python3 hack/verify-server-image-publication.py alias-decision "$version_status" "$version_observed" "$candidate_config")
          commit_decision=$(python3 hack/verify-server-image-publication.py alias-decision "$commit_status" "$commit_observed" "$candidate_config")
          echo "version_decision=$version_decision" >> "$GITHUB_OUTPUT"
          echo "commit_decision=$commit_decision" >> "$GITHUB_OUTPUT"
      - name: Publish exact container image aliases
        id: publish
        run: |
          docker tag chronos:rc "$CHRONOS_IMAGE_REPOSITORY:$VERSION"
          docker tag chronos:rc "$CHRONOS_IMAGE_REPOSITORY:$COMMIT"
          test "${{ steps.preflight.outputs.version_decision }}" != publish || docker push "$CHRONOS_IMAGE_REPOSITORY:$VERSION"
          test "${{ steps.preflight.outputs.commit_decision }}" != publish || docker push "$CHRONOS_IMAGE_REPOSITORY:$COMMIT"
          registry_token=$(curl --retry 3 -fsS -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" "https://ghcr.io/token?scope=repository:rleungx/chronos:pull" | jq -er .token)
          curl --retry 3 -fsS -H "Authorization: Bearer $registry_token" -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" "$REGISTRY_API/$VERSION" -D canonical.headers -o /dev/null
          canonical_digest=$(awk 'tolower($1) == tolower("Docker-Content-Digest:") { gsub(/\r/, "", $2); print $2 }' canonical.headers)
          python3 hack/verify-server-image-publication.py alias-verify 200 "$canonical_digest" "$canonical_digest"
          echo "digest=$canonical_digest" >> "$GITHUB_OUTPUT"
      - name: Verify aliases and create release authority
        run: |
          canonical_digest=${{ steps.publish.outputs.digest }}
          candidate_config=${{ steps.load.outputs.candidate_config }}
          registry_token=$(curl --retry 3 -fsS -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" "https://ghcr.io/token?scope=repository:rleungx/chronos:pull" | jq -er .token)
          version_status=$(curl --retry 3 -sS -H "Authorization: Bearer $registry_token" -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" -w '%{http_code}' "$REGISTRY_API/$VERSION" -D version.headers -o version.json)
          version_observed=$(awk 'tolower($1) == tolower("Docker-Content-Digest:") { gsub(/\r/, "", $2); print $2 }' version.headers)
          commit_status=$(curl --retry 3 -sS -H "Authorization: Bearer $registry_token" -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" -w '%{http_code}' "$REGISTRY_API/$COMMIT" -D commit.headers -o commit.json)
          commit_observed=$(awk 'tolower($1) == tolower("Docker-Content-Digest:") { gsub(/\r/, "", $2); print $2 }' commit.headers)
          python3 hack/verify-server-image-publication.py alias-verify "$version_status" "$version_observed" "$canonical_digest"
          python3 hack/verify-server-image-publication.py alias-verify "$commit_status" "$commit_observed" "$canonical_digest"
          test "$(jq -er '.config.digest' version.json)" = "$candidate_config"
          test "$(jq -er '.config.digest' commit.json)" = "$candidate_config"
          tar_sha="sha256:$(cut -d' ' -f1 chronos-rc-image.tar.sha256)"
          python3 hack/verify-server-image-publication.py release-json chronos-server-image.json "$CHRONOS_IMAGE_REPOSITORY" "$VERSION" "$COMMIT" "$tar_sha" "$candidate_config" "$canonical_digest"
      - name: Attest server image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.CHRONOS_IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_status=$(curl --retry 3 -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -w '%{http_code}' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" -o release.json)
          release_decision=$(python3 hack/verify-server-image-publication.py release-asset-decision "$release_status" chronos-server-image.json)
          test "$release_decision" != publish || gh release create "$GITHUB_REF_NAME" artifacts/release/* chronos-server-image.json --verify-tag --generate-notes
