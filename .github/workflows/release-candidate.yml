name: Release Candidate

on:
  workflow_dispatch:

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Run release checks
        run: make release-check
      - name: Package release artifacts
        run: |
          mkdir -p artifacts/release
          cp target/release/chronos artifacts/release/
          cp target/release/chronos-bench artifacts/release/
          cp target/release/chronos-control-bench artifacts/release/
          cp target/release/chronos-failover-bench artifacts/release/
          (cd artifacts/release && shasum -a 256 chronos chronos-bench chronos-control-bench chronos-failover-bench > SHA256SUMS)
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chronos-release-candidate
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
