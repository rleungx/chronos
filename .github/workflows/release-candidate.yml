name: Release Candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CHRONOS_ARTIFACT_RETENTION_DAYS: 14
  DOCKER_BUILDKIT: 1

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25.x'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          gradle-version: '9.4.0'
      - name: Install CI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ruby cmake libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc
          HELM_VERSION=v3.17.3
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          tar -C /tmp -xzf /tmp/helm.tar.gz
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate GitHub Actions workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Run release checks
        run: make release-check-core

  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - release-check
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Package release artifacts
        run: make release-package
      - name: Upload reusable release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}

  layer-4-clustered-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Start clustered etcd
        run: make etcd-cluster-up
      - name: Wait for clustered etcd health
        run: |
          for attempt in $(seq 1 60); do
            if make etcd-cluster-health; then
              exit 0
            fi
            if [ "$attempt" -lt 60 ]; then
              sleep 1
            fi
          done
          echo "clustered etcd did not become healthy within 60 attempts" >&2
          exit 1
      - name: Run clustered Layer 4 validation
        run: make test-layer-4-clustered
      - name: Run clustered etcd leader-loss validation
        run: make test-cluster-leader-loss
      - name: Upload clustered leader-loss artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-cluster-leader-loss-artifacts
          path: artifacts/cluster-leader-loss/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify clustered leader-loss evidence
        if: always()
        run: bash hack/verify-cluster-leader-loss.sh artifacts/cluster-leader-loss/summary.txt
      - name: Run owner-to-etcd partition validation
        run: make test-owner-etcd-partition
      - name: Upload owner-to-etcd partition artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-owner-etcd-partition-artifacts
          path: artifacts/owner-etcd-partition/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify owner-to-etcd partition evidence
        if: always()
        run: bash hack/verify-owner-etcd-partition.sh artifacts/owner-etcd-partition/summary.txt
      - name: Fetch pinned rolling-upgrade baseline
        run: |
          source hack/upgrade/baseline.env
          git fetch --no-tags --depth=1 origin "${CHRONOS_UPGRADE_BASE_SHA}"
      - name: Run same-format rolling-upgrade validation
        run: make test-rolling-upgrade
      - name: Upload rolling-upgrade artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-rolling-upgrade-artifacts
          path: artifacts/rolling-upgrade/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify rolling-upgrade evidence
        if: always()
        run: bash hack/verify-rolling-upgrade.sh artifacts/rolling-upgrade/summary.txt
      - name: Stop clustered etcd
        if: always()
        run: make etcd-cluster-reset

  soak-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run etcd-backed soak validation
        run: make test-soak
      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-soak-artifacts
          path: artifacts/soak/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify soak evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts soak
      - name: Reset etcd after soak job
        if: always()
        run: make etcd-reset

  chaos-lease-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run etcd-backed chaos recovery validation
        run: make test-chaos
      - name: Upload chaos artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-chaos-artifacts
          path: artifacts/chaos/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify chaos evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts chaos
      - name: Reset etcd after chaos job
        if: always()
        run: make etcd-reset

  failover-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run etcd-backed failover benchmark
        run: make test-failover-bench
      - name: Upload failover artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-failover-artifacts
          path: artifacts/failover/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify failover evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts failover
      - name: Reset etcd after failover job
        if: always()
        run: make etcd-reset

  auto-failover-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run etcd-backed automatic failover benchmark
        run: make test-auto-failover-bench
      - name: Upload automatic failover artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-auto-failover-artifacts
          path: artifacts/auto-failover/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify automatic failover evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts auto-failover
      - name: Reset etcd after automatic failover job
        if: always()
        run: make etcd-reset

  scale-matrix-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run etcd-backed scale matrix
        run: make test-scale-matrix-production
      - name: Upload scale matrix artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-scale-matrix-artifacts
          path: artifacts/scale-matrix/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify scale matrix evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts scale-matrix
      - name: Reset etcd after scale matrix job
        if: always()
        run: make etcd-reset

  rebalance-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run etcd-backed rebalance benchmark
        run: make test-rebalance-bench
      - name: Upload rebalance artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-rebalance-artifacts
          path: artifacts/rebalance/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify rebalance evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts rebalance
      - name: Reset etcd after rebalance job
        if: always()
        run: make etcd-reset

  restore-dr-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Run restore DR validation
        run: make test-restore-dr
      - name: Upload restore artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-restore-artifacts
          path: artifacts/restore/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify restore evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts restore

  container-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Build container image
        run: make CONTAINER_CHECK_IMAGE=chronos:rc CONTAINER_CHECK_FORCE_BUILD=1 container-image-check
      - name: Save container image
        run: docker save chronos:rc -o chronos-rc-image.tar
      - name: Upload container image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rc-image
          path: chronos-rc-image.tar
          if-no-files-found: error
          retention-days: 1

  container-runtime-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - container-image
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-image
      - name: Load container image
        run: docker load -i chronos-rc-image.tar
      - name: Validate container runtime asset
        run: make CONTAINER_CHECK_IMAGE=chronos:rc CONTAINER_CHECK_FORCE_BUILD=0 container-check

  container-vulnerability-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - container-image
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-image
      - name: Load container image
        run: docker load -i chronos-rc-image.tar
      - name: Scan container image vulnerabilities
        run: make CONTAINER_CHECK_IMAGE=chronos:rc CONTAINER_CHECK_FORCE_BUILD=0 container-vulnerability-scan

  package-release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: write
      id-token: write
    needs:
      - release-check
      - release-artifacts
      - layer-4-clustered-etcd
      - soak-real-etcd
      - chaos-lease-loss
      - failover-real-etcd
      - auto-failover-real-etcd
      - scale-matrix-real-etcd
      - rebalance-real-etcd
      - restore-dr-etcd
      - container-runtime-check
      - container-vulnerability-scan
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-rc-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench artifacts/release/chronos-upgrade-bench
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@b3e506e8c389afc651c5bacf2b8f2a1ea0557215
        with:
          subject-path: artifacts/release/*
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-release-candidate
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/release/* --verify-tag --generate-notes
