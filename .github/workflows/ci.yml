name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

env:
  CHRONOS_ARTIFACT_RETENTION_DAYS: 14
  DOCKER_BUILDKIT: 1

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: clients/go/go.mod
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate GitHub Actions workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" -color

  layer-0-3-verify:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Install CI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ruby
          HELM_VERSION=v3.17.3
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          tar -C /tmp -xzf /tmp/helm.tar.gz
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Run Layer 0 static
        run: make test-layer-0
      - name: Verify client conformance contract
        run: make client-conformance-check
      - name: Verify Rust example
        run: make client-example-check-rust
      - name: Run Layer 1 smoke
        run: make test-layer-1
      - name: Run Layer 2 binary startup and transport seam
        run: make test-layer-2
      - name: Run Layer 3 memory-path semantic regression
        run: make test-layer-3
      - name: Validate production-shape release config
        run: make release-shape-check
      - name: Validate observability rules
        run: make observability-check
      - name: Validate Kubernetes manifests
        run: make kubernetes-manifest-check
      - name: Validate dependency policy
        run: make dependency-check

  client-go:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: clients/go/go.mod
      - name: Verify Go client
        run: make client-check-go
      - name: Verify Go example
        run: make client-example-check-go

  client-java:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          gradle-version: '9.4.0'
      - name: Verify Java client
        run: make client-check-java
      - name: Verify Java example
        run: make client-example-check-java
      - name: Verify Java package metadata
        run: make client-package-check-java

  client-cpp:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Install C++ client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc
      - name: Verify C++ client
        run: make client-check-cpp
      - name: Verify C++ example
        run: make client-example-check-cpp
      - name: Verify C++ install metadata
        run: make client-package-check-cpp

  container-image:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Build container image
        run: make CONTAINER_CHECK_IMAGE=chronos:ci CONTAINER_CHECK_FORCE_BUILD=1 container-image-check
      - name: Save container image
        run: docker save chronos:ci -o chronos-ci-image.tar
      - name: Upload container image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-ci-image
          path: chronos-ci-image.tar
          if-no-files-found: error
          retention-days: 1

  container-runtime-check:
    runs-on: ubuntu-latest
    needs: container-image
    if: github.event_name != 'schedule'
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-ci-image
      - name: Load container image
        run: docker load -i chronos-ci-image.tar
      - name: Validate container delivery asset
        run: make CONTAINER_CHECK_IMAGE=chronos:ci CONTAINER_CHECK_FORCE_BUILD=0 container-check

  container-vulnerability-scan:
    runs-on: ubuntu-latest
    needs: container-image
    if: github.event_name != 'schedule'
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-ci-image
      - name: Load container image
        run: docker load -i chronos-ci-image.tar
      - name: Scan container image vulnerabilities
        run: make CONTAINER_CHECK_IMAGE=chronos:ci CONTAINER_CHECK_FORCE_BUILD=0 container-vulnerability-scan

  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Package reusable release artifacts
        run: make release-package
      - name: Upload reusable release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-ci-release-artifacts
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 1

  layer-4-clustered-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Start clustered etcd
        run: make etcd-cluster-up
      - name: Wait for clustered etcd health
        run: |
          for attempt in $(seq 1 60); do
            if make etcd-cluster-health; then
              exit 0
            fi
            if [ "$attempt" -lt 60 ]; then
              sleep 1
            fi
          done
          echo "clustered etcd did not become healthy within 60 attempts" >&2
          exit 1
      - name: Run clustered Layer 4 validation
        run: make test-layer-4-clustered
      - name: Stop clustered etcd
        if: always()
        run: make etcd-cluster-reset

  soak-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-ci-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench
      - name: Run etcd-backed soak validation
        run: make test-soak
      - name: Publish soak summary
        if: always()
        run: |
          if [ -f artifacts/soak/summary.txt ]; then
            {
              echo '## Soak validation summary'
              echo ''
              cat artifacts/soak/summary.txt
              echo ''
              echo '### Soak artifact files'
              ls -1 artifacts/soak
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-soak-artifacts
          path: artifacts/soak/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify soak evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts soak
      - name: Reset etcd after soak job
        if: always()
        run: make etcd-reset

  chaos-lease-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-ci-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench
      - name: Run etcd-backed chaos recovery validation
        run: make test-chaos
      - name: Publish chaos summary
        if: always()
        run: |
          if [ -f artifacts/chaos/summary.txt ]; then
            {
              echo '## Chaos validation summary'
              echo ''
              cat artifacts/chaos/summary.txt
              echo ''
              echo '### Chaos artifact files'
              ls -1 artifacts/chaos
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload chaos artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-chaos-artifacts
          path: artifacts/chaos/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify chaos evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts chaos
      - name: Reset etcd after chaos job
        if: always()
        run: make etcd-reset

  failover-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-ci-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench
      - name: Run etcd-backed failover benchmark
        run: make test-failover-bench
      - name: Publish failover summary
        if: always()
        run: |
          if [ -f artifacts/failover/summary.txt ]; then
            {
              echo '## Failover benchmark summary'
              echo ''
              cat artifacts/failover/summary.txt
              echo ''
              echo '### Failover artifact files'
              ls -1 artifacts/failover
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload failover artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-failover-artifacts
          path: artifacts/failover/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify failover evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts failover
      - name: Reset etcd after failover job
        if: always()
        run: make etcd-reset

  scale-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-ci-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench
      - name: Run etcd-backed scale benchmark
        run: make test-scale-bench
      - name: Publish scale summary
        if: always()
        run: |
          if [ -f artifacts/scale/summary.txt ]; then
            {
              echo '## Scale benchmark summary'
              echo ''
              cat artifacts/scale/summary.txt
              echo ''
              echo '### Scale artifact files'
              ls -1 artifacts/scale
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload scale artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-scale-artifacts
          path: artifacts/scale/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify scale evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts scale
      - name: Reset etcd after scale job
        if: always()
        run: make etcd-reset

  scale-matrix-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-ci-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench
      - name: Run reduced etcd-backed scale matrix
        run: make test-scale-matrix
      - name: Publish scale matrix summary
        if: always()
        run: |
          if [ -f artifacts/scale-matrix/summary.txt ]; then
            {
              echo '## Scale matrix summary'
              echo ''
              cat artifacts/scale-matrix/summary.txt
              echo ''
              echo '### Scale matrix artifact files'
              find artifacts/scale-matrix -maxdepth 3 -type f | sort
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload scale matrix artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-scale-matrix-artifacts
          path: artifacts/scale-matrix/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify scale matrix evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts scale-matrix
      - name: Reset etcd after scale matrix job
        if: always()
        run: make etcd-reset

  rebalance-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-ci-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench
      - name: Run etcd-backed rebalance benchmark
        run: make test-rebalance-bench
      - name: Publish rebalance summary
        if: always()
        run: |
          if [ -f artifacts/rebalance/summary.txt ]; then
            {
              echo '## Rebalance benchmark summary'
              echo ''
              cat artifacts/rebalance/summary.txt
              echo ''
              echo '### Rebalance artifact files'
              ls -1 artifacts/rebalance
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload rebalance artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-rebalance-artifacts
          path: artifacts/rebalance/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify rebalance evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts rebalance
      - name: Reset etcd after rebalance job
        if: always()
        run: make etcd-reset

  restore-dr-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - release-artifacts
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
      CHRONOS_SKIP_RELEASE_BUILD: 1
      CHRONOS_RELEASE_BIN_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-ci-release-artifacts
          path: artifacts/release
      - name: Restore release executable bits
        run: chmod +x artifacts/release/chronos artifacts/release/chronos-bench artifacts/release/chronos-control-bench artifacts/release/chronos-failover-bench
      - name: Run restore DR validation
        run: make test-restore-dr
      - name: Upload restore artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: chronos-restore-artifacts
          path: artifacts/restore/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify restore evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts restore
