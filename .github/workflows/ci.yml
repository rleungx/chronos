name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

env:
  CHRONOS_ARTIFACT_RETENTION_DAYS: 14

jobs:
  layer-0-3-verify:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Install CI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ruby
      - name: Run Layer 0 static
        run: make test-layer-0
      - name: Run Layer 1 smoke
        run: make test-layer-1
      - name: Run Layer 2 binary startup and transport seam
        run: make test-layer-2
      - name: Run Layer 3 memory-path semantic regression
        run: make test-layer-3
      - name: Validate production-shape release config
        run: make release-shape-check
      - name: Validate container delivery asset
        run: make container-check
      - name: Validate observability rules
        run: make observability-check
      - name: Validate Kubernetes manifests
        run: make kubernetes-manifest-check
      - name: Validate dependency policy
        run: make dependency-check

  client-go:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/go/go.mod
      - name: Verify Go client
        run: make client-check-go

  client-java:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Verify Java client
        run: make client-check-java

  client-cpp:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc
      - name: Verify C++ client
        run: make client-check-cpp

  container-vulnerability-scan:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Scan container image vulnerabilities
        run: make CONTAINER_CHECK_IMAGE=chronos:vulnerability-scan container-vulnerability-scan

  layer-4-clustered-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Start clustered etcd
        run: make etcd-cluster-up
      - name: Wait for clustered etcd health
        run: |
          for attempt in $(seq 1 60); do
            if make etcd-cluster-health; then
              exit 0
            fi
            sleep 1
          done
          echo "clustered etcd did not become healthy within 60 attempts" >&2
          exit 1
      - name: Run clustered Layer 4 validation
        run: make test-layer-4-clustered
      - name: Stop clustered etcd
        if: always()
        run: make etcd-cluster-reset

  soak-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Run etcd-backed soak validation
        run: make test-soak
      - name: Publish soak summary
        if: always()
        run: |
          if [ -f artifacts/soak/summary.txt ]; then
            {
              echo '## Soak validation summary'
              echo ''
              cat artifacts/soak/summary.txt
              echo ''
              echo '### Soak artifact files'
              ls -1 artifacts/soak
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronos-soak-artifacts
          path: artifacts/soak/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify soak evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts soak
      - name: Reset etcd after soak job
        if: always()
        run: make etcd-reset

  chaos-lease-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Run etcd-backed chaos recovery validation
        run: make test-chaos
      - name: Publish chaos summary
        if: always()
        run: |
          if [ -f artifacts/chaos/summary.txt ]; then
            {
              echo '## Chaos validation summary'
              echo ''
              cat artifacts/chaos/summary.txt
              echo ''
              echo '### Chaos artifact files'
              ls -1 artifacts/chaos
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload chaos artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronos-chaos-artifacts
          path: artifacts/chaos/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify chaos evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts chaos
      - name: Reset etcd after chaos job
        if: always()
        run: make etcd-reset

  failover-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Run etcd-backed failover benchmark
        run: make test-failover-bench
      - name: Publish failover summary
        if: always()
        run: |
          if [ -f artifacts/failover/summary.txt ]; then
            {
              echo '## Failover benchmark summary'
              echo ''
              cat artifacts/failover/summary.txt
              echo ''
              echo '### Failover artifact files'
              ls -1 artifacts/failover
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload failover artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronos-failover-artifacts
          path: artifacts/failover/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify failover evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts failover
      - name: Reset etcd after failover job
        if: always()
        run: make etcd-reset

  rebalance-real-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Run etcd-backed rebalance benchmark
        run: make test-rebalance-bench
      - name: Publish rebalance summary
        if: always()
        run: |
          if [ -f artifacts/rebalance/summary.txt ]; then
            {
              echo '## Rebalance benchmark summary'
              echo ''
              cat artifacts/rebalance/summary.txt
              echo ''
              echo '### Rebalance artifact files'
              ls -1 artifacts/rebalance
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload rebalance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronos-rebalance-artifacts
          path: artifacts/rebalance/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify rebalance evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts rebalance
      - name: Reset etcd after rebalance job
        if: always()
        run: make etcd-reset

  restore-dr-etcd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      CHRONOS_BUILD_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: 1
      CHRONOS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      CHRONOS_KEEP_ARTIFACTS_ON_SUCCESS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Run restore DR validation
        run: make test-restore-dr
      - name: Upload restore artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronos-restore-artifacts
          path: artifacts/restore/
          if-no-files-found: error
          retention-days: ${{ env.CHRONOS_ARTIFACT_RETENTION_DAYS }}
      - name: Verify restore evidence
        if: always()
        run: bash hack/verify-evidence.sh artifacts restore
