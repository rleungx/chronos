groups:
  - name: chronos-availability
    rules:
      - alert: ChronosDown
        expr: up{job="chronos"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Chronos metrics target is down
          description: Prometheus cannot scrape the Chronos metrics endpoint for 2 minutes.

      - alert: ChronosNotReady
        expr: tso_startup_ready{job="chronos"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Chronos is not ready
          description: Chronos has remained not-ready for at least 5 minutes.

  - name: chronos-correctness-signals
    rules:
      - alert: ChronosIdentityLeaseLost
        expr: increase(tso_identity_lease_events_total{job="chronos",event="lost"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Chronos lost its identity lease
          description: Identity lease loss was observed in the last 5 minutes.

      - alert: ChronosClockBackwards
        expr: increase(tso_clock_backwards_total{job="chronos"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Chronos observed a backward clock event
          description: A backward clock event was recorded in the last 10 minutes.

      - alert: ChronosMetadataErrors
        expr: sum(increase(tso_metadata_errors_total{job="chronos"}[5m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Chronos metadata operations are erroring
          description: Metadata store operations recorded errors in the last 5 minutes.

      - alert: ChronosMetadataRetries
        expr: sum(increase(tso_metadata_retries_total{job="chronos"}[5m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Chronos metadata operations are retrying
          description: Metadata store operations needed retries in the last 5 minutes.

  - name: chronos-control-plane
    rules:
      - alert: ChronosWatchResyncs
        expr: sum(increase(tso_watch_resync_total{job="chronos"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Chronos route watch restarted or resynced
          description: Route watch resync or reset events were recorded in the last 10 minutes.

      - alert: ChronosProxySaturation
        expr: increase(tso_timeline_proxy_saturated_total{job="chronos"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Chronos timeline proxy saturated
          description: Timeline proxy saturation events were recorded in the last 10 minutes.

      - alert: ChronosProxyTimeouts
        expr: increase(tso_timeline_proxy_timeout_total{job="chronos"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Chronos timeline proxy timed out
          description: Timeline proxy timeout events were recorded in the last 10 minutes.

      - alert: ChronosRuntimeCacheDegraded
        expr: sum(increase(tso_timeline_runtime_cache_events_total{job="chronos",event="degraded_uncached"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Chronos timeline runtime cache degraded to uncached serving
          description: Runtime cache saturation forced uncached timeline serving in the last 10 minutes.

      - alert: ChronosLeaseExpired
        expr: increase(tso_lease_expired_total{job="chronos"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Chronos observed lease expiration events
          description: Lease expiration events were recorded in the last 10 minutes.

      - alert: ChronosTransferFailures
        expr: sum(increase(tso_transfer_outcomes_total{job="chronos",outcome=~"failed|blocked"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Chronos transfer or failover actions failed
          description: Transfer or failover actions were blocked or failed in the last 10 minutes.

      - alert: ChronosRecoveryEvents
        expr: sum(increase(tso_recovery_events_total{job="chronos"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Chronos entered recovery paths
          description: Recover-and-continue paths were exercised in the last 10 minutes.

      - alert: ChronosShutdownEvents
        expr: sum(increase(tso_shutdown_total{job="chronos"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Chronos performed controlled shutdown actions
          description: Controlled shutdown reasons were recorded in the last 10 minutes.

      - alert: ChronosStartupPreflightFailures
        expr: sum(increase(tso_startup_preflight_fail_total{job="chronos"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Chronos startup preflight failures detected
          description: Startup preflight failures were recorded in the last 15 minutes.

      - alert: ChronosStartupBootstrapFailures
        expr: sum(increase(tso_startup_bootstrap_fail_total{job="chronos"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Chronos startup bootstrap failures detected
          description: Startup bootstrap failures were recorded in the last 15 minutes.

      - alert: ChronosMetricsRenderFailures
        expr: increase(tso_metrics_render_errors_total{job="chronos"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Chronos metrics rendering failed
          description: Prometheus metrics render failures were recorded in the last 10 minutes.
