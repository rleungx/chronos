services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: chronos-etcd
    command:
      - /usr/local/bin/etcd
      - --name=chronos-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=chronos-etcd=http://127.0.0.1:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - chronos-etcd-data:/etcd-data

volumes:
  chronos-etcd-data:
