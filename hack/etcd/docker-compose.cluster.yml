services:
  etcd1:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: chronos-etcd-1
    command:
      - /usr/local/bin/etcd
      - --name=chronos-etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://chronos-etcd-1:2380
      - --initial-cluster=chronos-etcd-1=http://chronos-etcd-1:2380,chronos-etcd-2=http://chronos-etcd-2:2380,chronos-etcd-3=http://chronos-etcd-3:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    volumes:
      - chronos-etcd-cluster-1:/etcd-data

  etcd2:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: chronos-etcd-2
    command:
      - /usr/local/bin/etcd
      - --name=chronos-etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:22379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://chronos-etcd-2:2380
      - --initial-cluster=chronos-etcd-1=http://chronos-etcd-1:2380,chronos-etcd-2=http://chronos-etcd-2:2380,chronos-etcd-3=http://chronos-etcd-3:2380
      - --initial-cluster-state=new
    ports:
      - "22379:2379"
    volumes:
      - chronos-etcd-cluster-2:/etcd-data

  etcd3:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: chronos-etcd-3
    command:
      - /usr/local/bin/etcd
      - --name=chronos-etcd-3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:32379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://chronos-etcd-3:2380
      - --initial-cluster=chronos-etcd-1=http://chronos-etcd-1:2380,chronos-etcd-2=http://chronos-etcd-2:2380,chronos-etcd-3=http://chronos-etcd-3:2380
      - --initial-cluster-state=new
    ports:
      - "32379:2379"
    volumes:
      - chronos-etcd-cluster-3:/etcd-data

volumes:
  chronos-etcd-cluster-1:
  chronos-etcd-cluster-2:
  chronos-etcd-cluster-3:
