apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chronos.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
data:
  CHRONOS_PROFILE: production
  CHRONOS_METADATA: etcd
  CHRONOS_SECURITY_MODE: {{ .Values.security.mode | quote }}
  CHRONOS_ETCD_ENDPOINTS: {{ .Values.etcd.endpoints | quote }}
  CHRONOS_ETCD_PREFIX: {{ .Values.etcd.prefix | quote }}
  CHRONOS_BIND_ADDR: 0.0.0.0:50051
  CHRONOS_HEALTH_BIND_ADDR: 0.0.0.0:9897
  CHRONOS_METRICS_BIND_ADDR: 0.0.0.0:9898
  CHRONOS_LOG_FORMAT: {{ .Values.runtime.logFormat | quote }}
  CHRONOS_LOG_FILTER: {{ .Values.runtime.logFilter | quote }}
  CHRONOS_OWNERSHIP_PLAN_ID: {{ include "chronos.ownershipPlanId" . | quote }}
  CHRONOS_GENERATOR_OWNERSHIP_MODULO: {{ .Values.ownership.shardCount | quote }}
  CHRONOS_OWNERSHIP_WORKER_COUNT: {{ .Values.replicaCount | quote }}
  CHRONOS_OWNERSHIP_ASSIGNMENT_SEED: {{ .Values.ownership.assignmentSeed | quote }}
  CHRONOS_SAFETY_GAP_MS: {{ .Values.runtime.safetyGapMs | quote }}
  CHRONOS_AUTO_FAILOVER_ENABLED: {{ .Values.autoFailover.enabled | quote }}
  CHRONOS_AUTO_FAILOVER_INTERVAL_MS: {{ .Values.autoFailover.intervalMs | quote }}
  CHRONOS_AUTO_FAILOVER_BATCH_SIZE: {{ .Values.autoFailover.batchSize | quote }}
  CHRONOS_GRPC_REQUEST_TIMEOUT_MS: {{ .Values.runtime.grpcRequestTimeoutMs | quote }}
  CHRONOS_GRPC_MAX_REQUEST_BYTES: {{ .Values.runtime.grpcMaxRequestBytes | quote }}
  CHRONOS_GRPC_MAX_CONCURRENT_REQUESTS: {{ .Values.runtime.grpcMaxConcurrentRequests | quote }}
  CHRONOS_ETCD_TIMEOUT_MS: {{ .Values.etcd.timeoutMs | quote }}
