apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "chronos.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "chronos.headlessServiceName" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      {{- include "chronos.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chronos.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "chronos.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if or .Values.podAntiAffinity.enabled .Values.affinity }}
      affinity:
        {{- with .Values.affinity.nodeAffinity }}
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.affinity.podAffinity }}
        podAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.podAntiAffinity.enabled }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "chronos.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
          {{- with .Values.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution }}
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- else with .Values.affinity.podAntiAffinity }}
        podAntiAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "chronos.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: install-tls
          image: debian:bookworm-slim@sha256:f9c6a2fd2ddbc23e336b6257a5245e31f996953ef06cd13a59fa0a1df2d5c252
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              for name in grpc metrics etcd; do
                mkdir -p "/work/${name}"
                cp "/input/${name}/tls.crt" "/work/${name}/tls.crt"
                cp "/input/${name}/tls.key" "/work/${name}/tls.key"
                cp "/input/${name}/ca.crt" "/work/${name}/ca.crt"
                chown -R 10001:10001 "/work/${name}"
                chmod 0444 "/work/${name}/tls.crt" "/work/${name}/ca.crt"
                chmod 0400 "/work/${name}/tls.key"
              done
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tls-work
              mountPath: /work
            - name: grpc-tls-input
              mountPath: /input/grpc
              readOnly: true
            - name: metrics-tls-input
              mountPath: /input/metrics
              readOnly: true
            - name: etcd-tls-input
              mountPath: /input/etcd
              readOnly: true
      containers:
        - name: chronos
          image: {{ include "chronos.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              ordinal="${POD_NAME##*-}"
              modulo="${CHRONOS_GENERATOR_OWNERSHIP_MODULO:?missing CHRONOS_GENERATOR_OWNERSHIP_MODULO}"
              case "${ordinal}" in
                ""|*[!0-9]*)
                  echo "POD_NAME must end with a numeric StatefulSet ordinal, got: ${POD_NAME}" >&2
                  exit 1
                  ;;
              esac
              case "${modulo}" in
                ""|*[!0-9]*)
                  echo "CHRONOS_GENERATOR_OWNERSHIP_MODULO must be numeric, got: ${modulo}" >&2
                  exit 1
                  ;;
              esac
              if [ "${ordinal}" -ge "${modulo}" ]; then
                echo "pod ordinal ${ordinal} must be < CHRONOS_GENERATOR_OWNERSHIP_MODULO=${modulo}" >&2
                exit 1
              fi
              export CHRONOS_GENERATOR_OWNERSHIP_REMAINDER="${ordinal}"
              exec /usr/local/bin/chronos
          ports:
            - name: grpc
              containerPort: 50051
            - name: health
              containerPort: 9897
            - name: metrics
              containerPort: 9898
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CHRONOS_WORKER_ID
              value: $(POD_NAME)
            - name: CHRONOS_INSTANCE_ID
              value: $(POD_NAME).{{ include "chronos.headlessServiceName" . }}.$(POD_NAMESPACE).svc.cluster.local:50051
            - name: CHRONOS_ADVERTISE_ENDPOINT
              value: $(POD_NAME).{{ include "chronos.headlessServiceName" . }}.$(POD_NAMESPACE).svc.cluster.local:50051
            - name: CHRONOS_GRPC_TLS_CERT_FILE
              value: /etc/chronos/ssl/grpc/tls.crt
            - name: CHRONOS_GRPC_TLS_KEY_FILE
              value: /etc/chronos/ssl/grpc/tls.key
            - name: CHRONOS_GRPC_CLIENT_CA_FILE
              value: /etc/chronos/ssl/grpc/ca.crt
            - name: CHRONOS_METRICS_TLS_CERT_FILE
              value: /etc/chronos/ssl/metrics/tls.crt
            - name: CHRONOS_METRICS_TLS_KEY_FILE
              value: /etc/chronos/ssl/metrics/tls.key
            - name: CHRONOS_METRICS_CLIENT_CA_FILE
              value: /etc/chronos/ssl/metrics/ca.crt
            - name: CHRONOS_ETCD_CA_FILE
              value: /etc/chronos/ssl/etcd/ca.crt
            - name: CHRONOS_ETCD_CERT_FILE
              value: /etc/chronos/ssl/etcd/tls.crt
            - name: CHRONOS_ETCD_KEY_FILE
              value: /etc/chronos/ssl/etcd/tls.key
            - name: CHRONOS_GRPC_CONTROL_CERT_ALLOWLIST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.clientCertAllowlistSecretName }}
                  key: control
            - name: CHRONOS_GRPC_ROUTE_CERT_ALLOWLIST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.clientCertAllowlistSecretName }}
                  key: route
            - name: CHRONOS_GRPC_TIMESTAMP_CERT_ALLOWLIST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.clientCertAllowlistSecretName }}
                  key: timestamp
            - name: CHRONOS_GRPC_STATUS_CERT_ALLOWLIST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.clientCertAllowlistSecretName }}
                  key: status
          envFrom:
            - configMapRef:
                name: {{ include "chronos.fullname" . }}-config
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 2
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 1
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tls-work
              mountPath: /etc/chronos/ssl
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tls-work
          emptyDir:
            medium: Memory
        - name: grpc-tls-input
          secret:
            secretName: {{ .Values.security.grpcTlsSecretName }}
            defaultMode: 0400
        - name: metrics-tls-input
          secret:
            secretName: {{ .Values.security.metricsTlsSecretName }}
            defaultMode: 0400
        - name: etcd-tls-input
          secret:
            secretName: {{ .Values.etcd.tlsSecretName }}
            defaultMode: 0400
