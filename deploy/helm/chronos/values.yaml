replicaCount: 3

image:
  repository: ghcr.io/rleungx/chronos
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

namespace:
  create: true

ownership:
  planId: ""
  # Set explicitly while replicaCount=0; use the target count if topology changes in the drain release.
  workerCount: 0
  shardCount: 256
  assignmentSeed: 20260516

etcd:
  endpoints: https://etcd-client.etcd.svc.cluster.local:2379
  prefix: /chronos
  timeoutMs: 1000
  tlsSecretName: chronos-etcd-client-tls

security:
  mode: required
  # Increment these values whenever same-name external Secrets are rotated.
  tlsRevision: "1"
  allowlistRevision: "1"
  clientCertAllowlistSecretName: chronos-client-cert-allowlist
  grpcTlsSecretName: chronos-grpc-tls
  metricsTlsSecretName: chronos-metrics-tls

runtime:
  logFormat: json
  logFilter: info
  # Must cover the monitored maximum pairwise wall-clock skew between workers.
  safetyGapMs: 500
  maxClockSkewMs: 500
  grpcRequestTimeoutMs: 250
  grpcMaxRequestBytes: 1048576
  grpcMaxConcurrentRequests: 1024
  grpcMaxConnections: 1024
  maxTimelineRecords: 100000
  terminationGracePeriodSeconds: 120

autoFailover:
  enabled: true
  intervalMs: 1000
  batchSize: 16

service:
  type: ClusterIP
  grpcPort: 50051
  healthPort: 9897
  metricsPort: 9898

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 5s
  tlsSecretName: chronos-metrics-client-tls
  serverName: chronos

networkPolicy:
  enabled: true
  clientPodSelector:
    app.kubernetes.io/part-of: chronos-client
  monitoringNamespaceSelector:
    kubernetes.io/metadata.name: monitoring

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 1Gi

podDisruptionBudget:
  enabled: true

podAntiAffinity:
  enabled: true

topologySpreadConstraints:
  enabled: true
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule

nodeSelector: {}
tolerations: []
affinity: {}
