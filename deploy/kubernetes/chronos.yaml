apiVersion: v1
kind: Namespace
metadata:
  name: chronos
  labels:
    app.kubernetes.io/name: chronos
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chronos
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: tso
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chronos-config
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: tso
data:
  CHRONOS_PROFILE: production
  CHRONOS_METADATA: etcd
  CHRONOS_SECURITY_MODE: required
  CHRONOS_ETCD_ENDPOINTS: https://etcd-client.etcd.svc.cluster.local:2379
  CHRONOS_ETCD_PREFIX: /chronos
  CHRONOS_BIND_ADDR: 0.0.0.0:50051
  CHRONOS_HEALTH_BIND_ADDR: 0.0.0.0:9897
  CHRONOS_METRICS_BIND_ADDR: 0.0.0.0:9898
  CHRONOS_LOG_FORMAT: json
  CHRONOS_LOG_FILTER: info
  CHRONOS_SAFETY_GAP_MS: "1"
  CHRONOS_AUTO_FAILOVER_ENABLED: "true"
  CHRONOS_AUTO_FAILOVER_INTERVAL_MS: "1000"
  CHRONOS_AUTO_FAILOVER_BATCH_SIZE: "16"
  CHRONOS_GRPC_REQUEST_TIMEOUT_MS: "100"
  CHRONOS_GRPC_MAX_REQUEST_BYTES: "1048576"
  CHRONOS_GRPC_MAX_CONCURRENT_REQUESTS: "256"
  CHRONOS_ETCD_TIMEOUT_MS: "1000"
---
apiVersion: v1
kind: Service
metadata:
  name: chronos-headless
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: tso
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: tso
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: health
      port: 9897
      targetPort: health
---
apiVersion: v1
kind: Service
metadata:
  name: chronos
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: tso
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: tso
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: metrics
      port: 9898
      targetPort: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chronos
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: tso
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chronos
      app.kubernetes.io/component: tso
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chronos
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: tso
spec:
  serviceName: chronos-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: chronos
      app.kubernetes.io/component: tso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chronos
        app.kubernetes.io/component: tso
    spec:
      serviceAccountName: chronos
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: chronos
                  app.kubernetes.io/component: tso
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: chronos
              app.kubernetes.io/component: tso
      initContainers:
        - name: install-tls
          image: debian:bookworm-slim@sha256:f9c6a2fd2ddbc23e336b6257a5245e31f996953ef06cd13a59fa0a1df2d5c252
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              for name in grpc metrics etcd; do
                mkdir -p "/work/${name}"
                cp "/input/${name}/tls.crt" "/work/${name}/tls.crt"
                cp "/input/${name}/tls.key" "/work/${name}/tls.key"
                cp "/input/${name}/ca.crt" "/work/${name}/ca.crt"
                chown -R 10001:10001 "/work/${name}"
                chmod 0444 "/work/${name}/tls.crt" "/work/${name}/ca.crt"
                chmod 0400 "/work/${name}/tls.key"
              done
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tls-work
              mountPath: /work
            - name: grpc-tls-input
              mountPath: /input/grpc
              readOnly: true
            - name: metrics-tls-input
              mountPath: /input/metrics
              readOnly: true
            - name: etcd-tls-input
              mountPath: /input/etcd
              readOnly: true
      containers:
        - name: chronos
          image: ghcr.io/rleungx/chronos:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: health
              containerPort: 9897
            - name: metrics
              containerPort: 9898
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CHRONOS_WORKER_ID
              value: $(POD_NAME)
            - name: CHRONOS_INSTANCE_ID
              value: $(POD_NAME).chronos-headless.$(POD_NAMESPACE).svc.cluster.local:50051
            - name: CHRONOS_ADVERTISE_ENDPOINT
              value: $(POD_NAME).chronos-headless.$(POD_NAMESPACE).svc.cluster.local:50051
            - name: CHRONOS_GRPC_TLS_CERT_FILE
              value: /etc/chronos/ssl/grpc/tls.crt
            - name: CHRONOS_GRPC_TLS_KEY_FILE
              value: /etc/chronos/ssl/grpc/tls.key
            - name: CHRONOS_GRPC_CLIENT_CA_FILE
              value: /etc/chronos/ssl/grpc/ca.crt
            - name: CHRONOS_METRICS_TLS_CERT_FILE
              value: /etc/chronos/ssl/metrics/tls.crt
            - name: CHRONOS_METRICS_TLS_KEY_FILE
              value: /etc/chronos/ssl/metrics/tls.key
            - name: CHRONOS_METRICS_CLIENT_CA_FILE
              value: /etc/chronos/ssl/metrics/ca.crt
            - name: CHRONOS_ETCD_CA_FILE
              value: /etc/chronos/ssl/etcd/ca.crt
            - name: CHRONOS_ETCD_CERT_FILE
              value: /etc/chronos/ssl/etcd/tls.crt
            - name: CHRONOS_ETCD_KEY_FILE
              value: /etc/chronos/ssl/etcd/tls.key
            - name: CHRONOS_GRPC_CONTROL_CERT_ALLOWLIST
              valueFrom:
                secretKeyRef:
                  name: chronos-client-cert-allowlist
                  key: control
            - name: CHRONOS_GRPC_ROUTE_CERT_ALLOWLIST
              valueFrom:
                secretKeyRef:
                  name: chronos-client-cert-allowlist
                  key: route
            - name: CHRONOS_GRPC_TIMESTAMP_CERT_ALLOWLIST
              valueFrom:
                secretKeyRef:
                  name: chronos-client-cert-allowlist
                  key: timestamp
            - name: CHRONOS_GRPC_STATUS_CERT_ALLOWLIST
              valueFrom:
                secretKeyRef:
                  name: chronos-client-cert-allowlist
                  key: status
          envFrom:
            - configMapRef:
                name: chronos-config
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 2
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 1
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tls-work
              mountPath: /etc/chronos/ssl
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tls-work
          emptyDir:
            medium: Memory
        - name: grpc-tls-input
          secret:
            secretName: chronos-grpc-tls
            defaultMode: 0400
        - name: metrics-tls-input
          secret:
            secretName: chronos-metrics-tls
            defaultMode: 0400
        - name: etcd-tls-input
          secret:
            secretName: chronos-etcd-client-tls
            defaultMode: 0400
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chronos
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: tso
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: chronos
  minReplicas: 3
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chronos-ingress
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: tso
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chronos
      app.kubernetes.io/component: tso
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: chronos-client
      ports:
        - protocol: TCP
          port: 50051
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9898
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chronos
  namespace: chronos
  labels:
    app.kubernetes.io/name: chronos
    app.kubernetes.io/component: tso
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chronos
      app.kubernetes.io/component: tso
  endpoints:
    - port: metrics
      path: /metrics
      scheme: https
      interval: 15s
      scrapeTimeout: 5s
      tlsConfig:
        ca:
          secret:
            name: chronos-metrics-client-tls
            key: ca.crt
        cert:
          secret:
            name: chronos-metrics-client-tls
            key: tls.crt
        keySecret:
          name: chronos-metrics-client-tls
          key: tls.key
        serverName: chronos
