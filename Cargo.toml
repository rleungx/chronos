[package]
name = "chronos"
version = "0.1.0"
edition = "2021"
build = "build.rs"
license = "MIT OR Apache-2.0"

[lib]
name = "chronos"
path = "src/lib.rs"

[[bin]]
name = "chronos"
path = "src/main.rs"

[dependencies]
tonic = { version = "0.14.5", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.5"
prost = "0.14.3"
prost-types = "0.14.3"
tokio = { version = "1.32", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
async-trait = "0.1"
dashmap = "6.0"
thiserror = "1.0"
etcd-client = { version = "0.17.0", features = ["tls", "tls-roots"] }
prometheus = { version = "0.13", default-features = false, features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hyper = { version = "0.14", features = ["client", "server", "http1", "tcp"] }
rustls = "0.23.38"
tokio-rustls = "0.26.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }

[build-dependencies]
tonic-build = "0.14.5"
tonic-prost-build = "0.14.5"

[dev-dependencies]
rcgen = "0.14"
