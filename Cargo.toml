[package]
name = "chronos"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "chronos"
path = "src/lib.rs"

[[bin]]
name = "chronos"
path = "src/main.rs"

[dependencies]
tonic = { version = "0.10", features = ["tls"] }
prost = "0.12"
prost-types = "0.12"
tokio = { version = "1.32", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
async-trait = "0.1"
dashmap = "6.0"
thiserror = "1.0"
etcd-client = { version = "0.12", features = ["tls"] }
prometheus = { version = "0.13", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hyper = "0.14"
rustls = "0.23"
rustls-pemfile = "2.2"
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }

[build-dependencies]
tonic-build = "0.10"

[dev-dependencies]
rcgen = "0.14"
