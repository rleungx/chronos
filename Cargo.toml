[package]
name = "chronos-tso"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "chronos_tso"
path = "src/lib.rs"

[[bin]]
name = "chronos-tso-demo"
path = "src/main.rs"

[dependencies]
tonic = "0.10"
prost = "0.12"
prost-types = "0.12"
tokio = { version = "1.32", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
dashmap = "6.0"
thiserror = "1.0"
etcd-client = "0.12"
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hyper = "0.14"

[build-dependencies]
tonic-build = "0.10"
